[project]
name = "zhomind-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.13.0,<2.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "bcrypt>=4.0.1,<4.1.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "redis>=5.0.0,<6.0.0",
  "pymilvus>=2.5.0,<3.0.0",
  "minio>=7.2.7,<8.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "langchain>=0.3.0,<0.4.0",
  "langgraph>=0.2.40,<0.3.0",
  "langchain-openai>=0.2.0,<0.3.0",
  "langchain-anthropic>=0.3.0,<0.4.0",
  "pypdf>=5.0.0,<6.0.0",
  "transformers>=4.46.0,<5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<0.25.0",
  "httpx>=0.27.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "ruff>=0.14.0,<1.0.0",
  "pyright>=1.1.390,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [
  ".venv",
  ".pytest_cache",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "ASYNC",
]
ignore = [
  "B008",   # FastAPI Depends() in default arguments is idiomatic here.
  "UP007",  # Prefer explicit optional syntax; existing code uses Optional-style unions.
  "UP042",  # AnswerOutcomeKind deliberately subclasses (str, Enum) so callers can
            # compare by identity and still serialize the string value.
  "ASYNC110", # Polling a threading.Event with a short sleep is the deliberate
              # pattern in the in-process document build runner gate.
]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportAttributeAccessIssue = "none"
